[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# QIE docs give no EVM level; a 1 Nov 2026 probe found Shanghai (PUSH0 ok, Cancun opcodes not). Keep "paris"; never "cancun".
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
cbor_metadata = true
fs_permissions = []

[profile.default.fuzz]
runs = 512
seed = "0x5eed"

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 2000

[profile.ci.invariant]
runs = 256
depth = 100

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
